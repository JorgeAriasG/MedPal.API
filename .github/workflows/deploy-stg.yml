name: Deploy Backend to Staging

on:
  push:
    branches:
      - dev
      - master
    paths:
      - 'Backend/Services/MedPalApi/MedPal.API/**'
      - '.github/workflows/deploy-backend-stg.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/medpal-api-stg

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            latest

      # Note: We need a Dockerfile in the Backend directory for this to work correctly in isolation
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/Services/MedPalApi/MedPal.API
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    
    steps:
      - name: Deploy to Local Homelab Server
        run: |
          # Navigate to the DevOps infrastructure folder
          cd /opt/medpal/infrastructure
          
          # Pull the latest staging image from GHCR
          docker compose -f docker-compose.stg.yml pull api-stg
          
          # Recreate the container with the new image
          docker compose -f docker-compose.stg.yml up -d --no-deps api-stg
          
          # Clean up old dangling images to save space
          docker image prune -f

